<include target="./header.html" />
<load target="../../../layouts/kitel_site/css/font.css" />
<load target="../../../layouts/kitel_site/css/form-theme.css" />
<load target="./calendar-admin-form.css" />

<form action="./" method="post" class="kitel-form-surface kitel-calendar-admin-form">
    <input type="hidden" name="module" value="admin" />
    <input type="hidden" name="act" value="procCalendarAdminInsertEvent" />
    <input type="hidden" name="mid" value="{$mid}" />
    <input type="hidden" name="event_srl" value="{$event->event_srl}"|cond="$event" />

    <h2>{$event ? '일정 수정' : '일정 등록'}</h2>
    <div class="kitel-calendar-admin-form__field">
        <label for="kitel-calendar-title">제목</label>
        <input id="kitel-calendar-title" type="text" name="title" value="{$event->title}" required />
    </div>
    <div class="kitel-calendar-admin-form__dates">
        <div class="kitel-calendar-admin-form__field">
            <label for="kitel-calendar-start">시작일</label>
            <input id="kitel-calendar-start" type="date" name="start_date" value="{substr($event->start_date,0,4)}-{substr($event->start_date,4,2)}-{substr($event->start_date,6,2)}"|cond="$event" required />
        </div>
        <div class="kitel-calendar-admin-form__field">
            <label for="kitel-calendar-end">종료일</label>
            <input id="kitel-calendar-end" type="date" name="end_date" value="{substr($event->end_date,0,4)}-{substr($event->end_date,4,2)}-{substr($event->end_date,6,2)}"|cond="$event" />
            <p class="kitel-calendar-admin-form__hint">비워두면 시작일과 같은 하루짜리 일정으로 등록됩니다.</p>
        </div>
    </div>
    <div class="kitel-calendar-admin-form__field">
        <label for="kitel-calendar-location">장소</label>
        <input id="kitel-calendar-location" type="text" name="location" value="{$event->location}" />
    </div>
    <div class="kitel-calendar-admin-form__field">
        <label for="kitel-calendar-category">분류</label>
        <input id="kitel-calendar-category" type="text" name="category" value="{$event->category}" placeholder="세미나 / 행사 / 방문 등" />
    </div>
    <div class="kitel-calendar-admin-form__field">
        <label for="kitel-calendar-description">상세 설명</label>
        <textarea id="kitel-calendar-description" name="description" rows="5">{$event->description}</textarea>
    </div>
    <div class="kitel-calendar-admin-form__actions">
        <button type="submit" class="x_btn x_btn-primary">저장</button>
        <a class="x_btn" href="{getUrl('act','dispCalendarAdminContent')}">취소</a>
    </div>
</form>
