<include target="./header.html" />
<load target="./task-form.js" />
<form action="./" method="post" class="kitel-hw-admin kitel-hw-admin__task-form" id="kitel-task-form">
    <input type="hidden" name="module" value="admin" /><input type="hidden" name="act" value="procHomeworkAdminInsertTask" /><input type="hidden" name="mid" value="{$mid}" /><input type="hidden" name="task_srl" value="{$task->task_srl}"|cond="$task" />
    <div class="kitel-hw-admin__editor-card">
        <h2>{$task ? '과제 수정' : '과제 추가'}</h2>
        <label for="hw-task-title">과제 제목</label><input id="hw-task-title" type="text" name="title" value="{$task->title}" required maxlength="250" />
    </div>
    <section class="kitel-hw-admin__field-section" aria-labelledby="hw-fields-title">
        <h2 id="hw-fields-title">과제 문항</h2>
        <p>질문과 답변 칸을 한 문항씩 구성합니다. 질문에는 이미지를 붙여넣거나 끌어 놓을 수 있습니다. 답변 칸 오른쪽 아래를 끌면 높이가 바뀝니다.</p>
        <div id="hw-field-list">
            <div class="kitel-hw-admin__field" loop="$author_questions=>$index,$question">
                <input type="hidden" name="primary_height" value="{$question['height']}" class="js-field-height" cond="$index === 0" />
                <input type="hidden" name="field_id[]" value="{$question['id']}" cond="$index > 0" />
                <input type="hidden" name="field_height[]" value="{$question['height']}" class="js-field-height" cond="$index > 0" />
                <textarea name="description" class="js-prompt-value" hidden cond="$index === 0"></textarea>
                <textarea name="field_prompt_html[]" class="js-prompt-value" hidden cond="$index > 0"></textarea>
                <div class="kitel-hw-admin__field-heading"><h3>문항 {$index + 1}</h3><button type="button" class="x_btn js-remove-field" cond="$index > 0">문항 삭제</button></div>
                <label>질문 내용</label>
                <div class="kitel-hw-admin__prompt-editor js-prompt-editor" contenteditable="true" role="textbox" aria-label="문항 {$index + 1} 질문 내용" aria-multiline="true" data-placeholder="질문을 작성해 주세요">{$question['prompt_html']|noescape}</div>
                <div class="kitel-hw-admin__image-tools"><button type="button" class="x_btn js-insert-image">이미지 넣기</button><input type="file" class="js-image-picker" accept="image/png,image/jpeg,image/webp,image/gif" hidden /><span>이미지를 본문으로 끌어 놓거나 붙여넣을 수도 있습니다.</span></div>
                <label>답변 칸 미리보기</label><textarea class="js-field-preview" style="height:{$question['height']}px" readonly placeholder="준회원이 여기에 답을 입력합니다."></textarea>
            </div>
        </div>
        <button type="button" id="hw-add-field" class="x_btn">+ 문항 추가</button>
    </section>
    <div class="kitel-hw-admin__editor-card">
        <h2>제출 설정</h2>
        <label for="hw-task-deadline">마감일</label><input id="hw-task-deadline" type="date" name="deadline" value="{substr($task->deadline,0,4)}-{substr($task->deadline,4,2)}-{substr($task->deadline,6,2)}"|cond="$task && $task->deadline" />
        <label for="hw-task-extensions">제출 첨부파일 허용 형식</label><input id="hw-task-extensions" type="text" name="allowed_extensions" value="{$task->allowed_extensions}" placeholder="예: pdf,zip,docx" /><p class="kitel-hw-admin__hint">쉼표로 구분합니다. 비워 두면 형식을 제한하지 않습니다.</p>
    </div>
    <div class="kitel-hw-admin__form-actions"><button type="submit" class="x_btn x_btn-primary">저장</button><a class="x_btn" href="{getUrl('act','dispHomeworkAdminContent')}">취소</a></div>
</form>
<template id="hw-field-template"><div class="kitel-hw-admin__field"><input type="hidden" name="field_id[]" /><input type="hidden" name="field_height[]" value="270" class="js-field-height" /><textarea name="field_prompt_html[]" class="js-prompt-value" hidden></textarea><div class="kitel-hw-admin__field-heading"><h3>문항</h3><button type="button" class="x_btn js-remove-field">문항 삭제</button></div><label>질문 내용</label><div class="kitel-hw-admin__prompt-editor js-prompt-editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="질문을 작성해 주세요"></div><div class="kitel-hw-admin__image-tools"><button type="button" class="x_btn js-insert-image">이미지 넣기</button><input type="file" class="js-image-picker" accept="image/png,image/jpeg,image/webp,image/gif" hidden /><span>이미지를 본문으로 끌어 놓거나 붙여넣을 수도 있습니다.</span></div><label>답변 칸 미리보기</label><textarea class="js-field-preview" style="height:270px" readonly placeholder="준회원이 여기에 답을 입력합니다."></textarea></div></template>
