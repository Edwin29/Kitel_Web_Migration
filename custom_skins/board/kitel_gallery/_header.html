<load target="board.default.css" />
<load target="board.default.js" type="body" />
<load target="kitel-gallery.css" />
<load target="kitel-gallery.js" type="body" />
{@ $category_list = $category_list ?? array(); $search_option = $search_option ?? array(); }
<div class="board kitel-gallery">
    <div cond="$module_info->header_text" class="kitel-gallery__intro">{$module_info->header_text}</div>
    <header cond="!$oDocument->isExists() && $act !== 'dispBoardWrite'" class="kitel-gallery__heading">
        <div>
            <h1>{$module_info->browser_title ?: '작품전시회 게시판'}</h1>
            <p cond="$module_info->description">{$module_info->description}</p>
        </div>
        <div class="kitel-gallery__heading-actions">
            <div cond="$grant->manager" class="kitel-gallery__management">
                <a href="{getUrl('','mid',$mid,'act','dispDocumentManageDocument')}" onclick="popopen(this.href,'manageDocument'); return false;">{$lang->cmd_manage_document}</a>
                <a href="{getUrl('act','dispBoardAdminBoardInfo')}">{$lang->cmd_setup}</a>
            </div>
            <div class="kitel-gallery__toolbar">
                <a cond="$grant->write_document" class="kitel-write-action" href="{getUrl('', 'mid', $mid, 'act', 'dispBoardWrite')}">{$lang->cmd_write}</a>
                <form action="{getUrl()}" method="get" class="kitel-filter-search" role="search" rx-autoform="false">
                    <input type="hidden" name="mid" value="{$mid}" />
                    <input cond="Context::get('year')" type="hidden" name="year" value="{escape((string)Context::get('year'), false)}" />
                    <label class="kitel-filter-search__label" for="kitel-gallery-keyword">게시판 검색</label>
                    <input id="kitel-gallery-keyword" type="search" name="search_keyword" value="{escape($search_keyword ?? '', false)}" />
                    <select name="search_target" aria-label="검색 대상">
                        <option loop="$search_option=>$key,$val" value="{$key}" selected="selected"|cond="$search_target==$key">{$val}</option>
                    </select>
                    <button type="submit" aria-label="검색"></button>
                </form>
            </div>
        </div>
    </header>
