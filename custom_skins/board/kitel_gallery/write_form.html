<include target="_header.html" />
<form action="./" method="post" onsubmit="return procFilter(this, window.insert)" class="kitel-gallery__write">
    <input type="hidden" name="mid" value="{$mid}" />
    <input type="hidden" name="content" value="{escape($oDocument->getContentText(), false)}" />
    <input type="hidden" name="document_srl" value="{$document_srl}" />
    <input type="hidden" name="comment_status" value="DENY" />
    <input type="hidden" name="allow_trackback" value="N" />
    <div class="kitel-gallery__write-heading">
        <div>
            <h1>{$oDocument->isExists() ? '작품 수정' : '작품 출품'}</h1>
            <p>작품 정보와 필수 파일을 등록해 주세요. 공개 시점은 기술부가 전체 작품에 대해 관리합니다.</p>
        </div>
        <button type="submit">{$lang->cmd_registration}</button>
    </div>
    <div class="kitel-gallery__write-fields">
        <label for="kitel-gallery-title">작품명 <em>*</em></label>
        <input id="kitel-gallery-title" name="title" type="text" value="{escape($oDocument->getTitleText(), false)}" required />
        <div cond="count($extra_keys)" class="kitel-gallery__extra-fields">
            <div loop="$extra_keys=>$key,$val">
                <label>{$val->name}<em cond="$val->is_required=='Y'"> *</em></label>
                {$val->getFormHTML()}
            </div>
        </div>
        <label>자세한 작품 내용</label>
        <div class="kitel-gallery__editor">{$oDocument->getEditor()}</div>
        <p class="kitel-gallery__field-help">카드의 흰색 오버레이에는 ‘작품 한 줄 소개’가 표시됩니다.</p>
    </div>
    <p class="kitel-gallery__review-note">작품별 심사·평가 없이 기술부가 게시판의 전체 공개 상태를 전환합니다.</p>
    <div cond="isset($captcha) && $captcha && $captcha->isTargetAction('document')">{$captcha}</div>
    <div class="kitel-gallery__write-actions">
        <button type="submit">{$lang->cmd_registration}</button>
        <a href="{getUrl('act','','document_srl','')}">{$lang->cmd_cancel}</a>
    </div>
</form>
<include target="_footer.html" />
