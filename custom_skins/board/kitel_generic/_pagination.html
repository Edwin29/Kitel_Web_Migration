<nav cond="($document_list || $notice_list) && $page_navigation" class="kitel-board__pagination" aria-label="게시글 페이지">
    <a cond="$page > 1" href="{getUrl('page',1,'document_srl','','division',$division,'last_division',$last_division)}">First</a>
    <span cond="$page <= 1" aria-disabled="true">First</span>
    <a cond="$page > 1" href="{getUrl('page',$page-1,'document_srl','','division',$division,'last_division',$last_division)}">Back</a>
    <span cond="$page <= 1" aria-disabled="true">Back</span>
    <block loop="$page_no=$page_navigation->getNextPage()">
        <strong cond="$page==$page_no" aria-current="page">{$page_no}</strong>
        <a cond="$page!=$page_no" href="{getUrl('page',$page_no,'document_srl','','division',$division,'last_division',$last_division)}">{$page_no}</a>
    </block>
    <a cond="$page < $page_navigation->last_page" href="{getUrl('page',$page+1,'document_srl','','division',$division,'last_division',$last_division)}">Next</a>
    <span cond="$page >= $page_navigation->last_page" aria-disabled="true">Next</span>
    <a cond="$page < $page_navigation->last_page" href="{getUrl('page',$page_navigation->last_page,'document_srl','','division',$division,'last_division',$last_division)}">Last</a>
    <span cond="$page >= $page_navigation->last_page" aria-disabled="true">Last</span>
</nav>
