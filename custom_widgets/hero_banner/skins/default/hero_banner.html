<style>
.kitel_hero { position:relative; min-height:360px; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; background:#1a1a1a; background-size:cover; background-position:center; overflow:hidden; padding:40px 20px; }
.kitel_hero::before { content:""; position:absolute; inset:0; background:rgba(0,0,0,0.45); }
.kitel_hero_inner { position:relative; z-index:1; max-width:640px; }
.kitel_hero_headline { font-size:2.1em; font-weight:700; margin:0 0 14px; line-height:1.3; }
.kitel_hero_subtext { font-size:1.05em; opacity:.92; margin:0 0 22px; white-space:pre-line; }
.kitel_hero_cta { display:inline-block; padding:10px 28px; background:#fff; color:#1a1a1a; border-radius:24px; text-decoration:none; font-weight:600; transition:opacity .15s ease; }
.kitel_hero_cta:hover { opacity:.85; }
.kitel_hero_empty { color:#999; font-size:.9em; }
</style>
<div class="kitel_hero" style="background-image:url('{$bg_image}');"|cond="$bg_image">
	<div class="kitel_hero_inner">
		<block cond="$headline || $subtext">
			<h2 class="kitel_hero_headline" cond="$headline">{$headline}</h2>
			<p class="kitel_hero_subtext" cond="$subtext">{$subtext}</p>
			<a class="kitel_hero_cta" href="{$cta_url}" cond="$cta_text && $cta_url">{$cta_text}</a>
		</block>
		<p class="kitel_hero_empty" cond="!$headline && !$subtext">관리자 화면에서 히어로 배너 문구를 입력해주세요.</p>
	</div>
</div>
