<config autoescape="on" />
<load target="hero_banner.css" />
<load target="hero_banner.js" type="body" />
<section class="kitel-hero" aria-label="KITEL 소개 배너">
    <img cond="$bg_image" class="kitel-hero__media" src="{$bg_image}" alt="" />
    <div class="kitel-hero__shade" aria-hidden="true"></div>
    <div class="kitel-hero__inner kitel-container">
        <div class="kitel-hero__copy" cond="$headline || $subtext">
            <h1 class="kitel-hero__headline" cond="$headline">{$headline}</h1>
            <p class="kitel-hero__subtext" cond="$subtext">{$subtext}</p>
            <a class="kitel-hero__cta" href="{$cta_url}" cond="$cta_text && $cta_url">{$cta_text} <span aria-hidden="true">↗</span></a>
        </div>
        <p class="kitel-hero__empty" cond="!$headline && !$subtext">관리자 화면에서 히어로 배너 문구를 입력해주세요.</p>
    </div>
    <a class="kitel-hero__scroll" href="#kitel-home-content" aria-label="아래 콘텐츠로 이동"><img src="./assets/arrow-down.svg" width="50" height="50" alt="" /></a>
</section>
