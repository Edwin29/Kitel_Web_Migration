<config autoescape="on" />
<load target="upcoming_events.css" />
<section class="kitel-upcoming" aria-labelledby="kitel-upcoming-title">
    <div class="kitel-upcoming__heading"><div><p class="kitel-upcoming__eyebrow">KITEL CALENDAR</p><h2 id="kitel-upcoming-title">다가오는 일정</h2></div><a href="{$calendar_url}" cond="$calendar_url">전체 일정 보기 →</a></div>
    <p class="kitel-upcoming__empty" cond="!count($events)">예정된 일정이 없습니다. 새로운 일정이 등록되면 이곳에 표시됩니다.</p>
    <ul class="kitel-upcoming__list" cond="count($events)">
        <li loop="$events=>$idx,$event"><a href="{$calendar_url}"><time class="kitel-upcoming__date" datetime="{substr($event->start_date,0,4)}-{substr($event->start_date,4,2)}-{substr($event->start_date,6,2)}"><span>{(int)substr($event->start_date,4,2)}월</span><strong>{(int)substr($event->start_date,6,2)}</strong></time><span class="kitel-upcoming__event"><strong>{$event->title}</strong><small cond="$event->location">{$event->location}</small></span><span class="kitel-upcoming__arrow" aria-hidden="true">→</span></a></li>
    </ul>
</section>
