<style>
.kitel_upcoming { max-width:480px; }
.kitel_upcoming_title { font-size:1.3em; font-weight:700; margin:0 0 16px; }
.kitel_upcoming_list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.kitel_upcoming_item { display:flex; align-items:center; gap:14px; padding:10px 12px; border:1px solid #e6e6e6; border-radius:8px; text-decoration:none; color:inherit; }
.kitel_upcoming_item:hover { border-color:#bbb; }
.kitel_upcoming_date { flex:0 0 auto; width:52px; text-align:center; }
.kitel_upcoming_date .month { display:block; font-size:.72em; color:#888; }
.kitel_upcoming_date .day { display:block; font-size:1.3em; font-weight:700; line-height:1.1; }
.kitel_upcoming_body { flex:1; min-width:0; }
.kitel_upcoming_event_title { font-weight:600; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kitel_upcoming_location { font-size:.82em; color:#888; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kitel_upcoming_empty { color:#999; font-size:.9em; padding:20px 0; }
.kitel_upcoming_more { display:inline-block; margin-top:14px; font-size:.88em; color:#555; text-decoration:none; }
.kitel_upcoming_more:hover { text-decoration:underline; }
</style>
<div class="kitel_upcoming">
	<p class="kitel_upcoming_title">다가오는 일정</p>
	<p class="kitel_upcoming_empty" cond="!count($events)">예정된 일정이 없습니다.</p>
	<ul class="kitel_upcoming_list" cond="count($events)">
		<li loop="$events=>$idx,$event">
			<a class="kitel_upcoming_item" href="{$calendar_url}">
				<span class="kitel_upcoming_date">
					<span class="month">{(int)substr($event->start_date,4,2)}월</span>
					<span class="day">{(int)substr($event->start_date,6,2)}</span>
				</span>
				<span class="kitel_upcoming_body">
					<p class="kitel_upcoming_event_title">{$event->title}</p>
					<p class="kitel_upcoming_location" cond="$event->location">{$event->location}</p>
				</span>
			</a>
		</li>
	</ul>
	<a class="kitel_upcoming_more" href="{$calendar_url}" cond="$calendar_url">전체 일정 보기 &rarr;</a>
</div>
